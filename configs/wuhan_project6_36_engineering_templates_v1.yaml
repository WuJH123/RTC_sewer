_inherits: configs/wuhan_project6_36_actual_repair_v1.yaml

# 36-facility engineering-template branch.
# Templates are extracted from prior smoke/formal closed-loop histories and are
# treated as reusable engineering action groups, not as fixed replay actions.
# The controller still runs rolling-horizon scoring at every 5-min control step
# and only executes the first row of the selected [H,36] sequence.
controller:
  temporal_joint:
    candidate_search:
      max_candidates: 768
      max_simultaneous_changes: 8
      max_change_points: 2
      continuous_max_delta: 0.12
      continuous_delta_levels: [0.05, 0.10, 0.12]
      binary_pump_ids: [ADD301.2, ADD301.3]
      binary_pump_min_dwell_steps: 2
      max_pump_switches_per_event: 6
      storage_interlock: true
      max_storage_actuators: 4
      engineering_template_path: outputs/deployment_evidence/engineering_templates_tfv_boost_profile_v1.json
    deployment_reliability:
      evidence_csv: outputs/deployment_evidence/actual_repair_v1_tfv_boost_profile_windows.csv
      require_evidence: true
      time_tolerance_min: 0.25
      stratum_rules:
        - patterns: [chicago_center]
          return_period_min: 20
          return_period_max: 50
    safety:
      pfv_abs_margin_m3: 100.0
      pfv_rel_margin: 0.02
      peak_margin: 0.0
      uncertainty_z: 0.0
      min_tfv_lcb_reduction: 0.0
      use_classifier_thresholds: false
      tfv_reduction_weight: 1.0
      peak_reduction_weight: 2500.0
      engineering_template_bonus: 1000.0
      action_l1_penalty: 0.02
      simultaneous_action_penalty: 0.01
      pump_switch_penalty: 0.05
    hierarchical:
      require_residual_validation: false

outputs:
  diagnostics: outputs/diagnostics_temporal_joint_36_engineering_templates_v1
