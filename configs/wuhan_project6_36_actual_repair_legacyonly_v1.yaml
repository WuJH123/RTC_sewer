_inherits: configs/wuhan_project6_36_actual_repair_v1.yaml

# Same 36-actuator retrofit network, but deploy only the verified v8 legacy
# engineering action layer. This is the fallback when the new 10-asset residual
# effect model has not learned reliable TFV/peak direction.
controller:
  temporal_joint:
    safety:
      pfv_abs_margin_m3: 100.0
      pfv_rel_margin: 0.02
      peak_margin: 0.0
      uncertainty_z: 0.0
      min_tfv_lcb_reduction: 0.0
      use_classifier_thresholds: false
      tfv_reduction_weight: 1.0
      peak_reduction_weight: 2500.0
      action_l1_penalty: 0.02
      simultaneous_action_penalty: 0.01
      pump_switch_penalty: 0.05
    hierarchical:
      enabled: true
      require_residual_validation: true

outputs:
  diagnostics: outputs/diagnostics_temporal_joint_36_actual_repair_legacyonly_v1
