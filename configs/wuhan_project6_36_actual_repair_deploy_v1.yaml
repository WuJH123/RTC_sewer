_inherits: configs/wuhan_project6_36_actual_repair_v1.yaml

# Deployment branch for actual TFV/peak repair.
# The model gate is not used as a publication gate here. Instead, deployment
# is restricted to rainfall strata where the completed closed-loop evidence
# showed stable TFV repair while retaining the 2% PFV non-inferiority target.
# All other strata are evaluated, but safely fall back to No-control.
controller:
  temporal_joint:
    deployment_reliability:
      allowed_patterns: [chicago_center]
      return_period_min: 20
      return_period_max: 50
    safety:
      pfv_abs_margin_m3: 100.0
      pfv_rel_margin: 0.02
      peak_margin: 0.0
      uncertainty_z: 0.0
      min_tfv_lcb_reduction: 0.0
      use_classifier_thresholds: false
      tfv_reduction_weight: 1.0
      peak_reduction_weight: 2500.0
      action_l1_penalty: 0.02
      simultaneous_action_penalty: 0.01
      pump_switch_penalty: 0.05

outputs:
  diagnostics: outputs/diagnostics_temporal_joint_36_actual_repair_deploy_v1
