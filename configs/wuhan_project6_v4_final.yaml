project:
  root: .
  network: data/wuhan_v8_storage_retrofit.inp
  contract: docs/contracts/PROJECT6_V4_FINAL_PIPELINE_CONTRACT.json
  paper_workflow_contract: docs/contracts/PROJECT6_V42_PAPER_WORKFLOW_CONTRACT.json
  canonical_ids: data/project6_v8_storage_retrofit_control_enabled_ids.txt
  facility_semantics: data/project6_v3_facility_semantics_36.csv
  priority_nodes: data/project5_design/priority_pfv_core_nodes.txt
  sentinel_nodes: data/project6_v3_sentinel_nodes.txt
  event_catalog: outputs/project6_pfvfirst_dualfallback_10min_v3/event_catalog/event_catalog.csv
  revealed_event_registry: outputs/project6_dual_reference_v4/final_v4/inventory/revealed_event_registry.csv
  output_root: outputs/project6_dual_reference_v4/final_v4

runtime:
  workers: 16
  max_workers: 16
  max_retries: 1
  minimum_free_disk_bytes: 1073741824
  minimum_free_memory_bytes: 1073741824
  heartbeat_interval_sec: 60
  atomic_cache_writes: true
  one_reference_writer_per_checkpoint: true
  network_variant: rainfall_only_no_dwf
  record_step_min: 5
  control_step_min: 10
  history_min: 60
  history_frames: 13
  horizon_min: 120
  horizon_steps: 12
  max_active_changes: 8
  use_hotstart: false
  authoritative_swmm: true

thresholds:
  scientific_margin:
    pfv_m3: 0.0
    tfv_m3: 0.0
    peak_m3s: 0.0
  dead_zone:
    pfv_m3: 1.0
    tfv_m3: 1.0
    peak_m3s: 0.001
  numerical_repeat_tolerance:
    pfv_m3: 0.0
    tfv_m3: 0.0
    peak_m3s: 0.0
  materially_beneficial:
    minimum_tfv_improvement_m3: 25.0
    minimum_benefit_cost_ratio: 1.5

opportunity:
  scan_event_limit: 0
  post_rain_buffer_min: 180
  responsive_threshold: 0.25
  checkpoint_interval_min: 10
  minimum_checkpoint_spacing_min: 30
  development_events_min: 8
  responsive_per_event: 4
  responsive_total_min: 32
  low_opportunity_per_event: 1
  rainfall_families_min: 3
  risk_levels_min: 3
  pilot_events: 8
  train_calibration_validation_events: 64
  reserve_events: 16
  min_standard_eligible_events: 88
  normalization: event_robust_or_no_rain_baseline
  dwf_features_permitted: false

peak_boundary:
  events_min: 3
  checkpoints_min: 6
  degraded_samples_min: 30
  degraded_samples_max: 60
  pfv_safe_hard_negative_min: 10
  families_min: 2

pilot400:
  events: 8
  checkpoints_per_event: 5
  candidates_per_checkpoint: 10
  planned: 400
  split:
    pilot_train: 5
    pilot_calibration: 1
    pilot_validation: 1
    pilot_challenge: 1

pilot:
  primary_candidates_per_state: 10
  reserve_candidates_per_state: 5
  min_accepted_informative_total: 300
  min_accepted_per_responsive_state: 6
  max_candidate_budget_per_state: 15

partial:
  caps:
    noop_ratio_max: 0.2
    projection_collapse_ratio_max: 0.2

train1600:
  accepted_target: 1600
  primary_events: 64
  reserve_events: 16
  checkpoints_per_event: 5
  candidates_per_checkpoint: 5
  rounds: [400, 400, 400, 400]
  target_accepted_per_state: 5
  initial_candidate_budget_per_state: 6
  maximum_candidate_budget_per_state: 10
  target_accepted_total: 1600
  allow_duplicate_replacement: false
  split:
    train: 48
    calibration: 8
    locked_validation: 8
    reserve: 16

# Canonical paper-line controller. Legacy V3/V4 modules remain readable for
# historical evidence but cannot authorize the formal V4.2 workflow.
mpc_v42:
  selector: sewerrtc.control.pfvfirst_mpc_v42.decide_pfvfirst_mpc
  pfv_reference: no_control
  peak_reference: dynamic_internal_rules
  tfv_reference: dynamic_internal_rules
  max_changed_facilities: 8
  hard_constraints:
    - PFV
    - Peak
    - K
    - bounds
    - rate
    - ramp
    - dwell
    - interlock
    - uncertainty
    - OOD
    - executability
  objective: delta_TFV_DI + lambda_action*J_action + lambda_terminal*J_terminal + lambda_uncertainty*J_uncertainty
  tfv_is_hard_safety_constraint: false
  fallback_policy: frozen_fail_closed
  lambda_action: 0.05
  lambda_terminal: 0.10
  lambda_uncertainty: 0.10

paper_workflow:
  contract_id: PROJECT6_V42_PAPER_WORKFLOW_V1
  model_line: v42_trajectory_first_multi_reference
  state_role: state_estimation_only_not_policy
  formal_state_reconstructor: sewerrtc.models.temporal_sparse_gat_v42.TemporalSparseGATReconstructorV42
  state_adapter: sewerrtc.state.v42_sparse_state.build_sparse_state_estimate
  historical_sr0p15_role: legacy_single_snapshot_depth_validation_only
  historical_sr0p15_can_authorize_formal: false
  surrogate_role: hydraulic_surrogate_not_policy
  formal_surrogate: sewerrtc.v4.models_v42.hydraulic_multi_reference.MultiReferenceHydraulicSurrogate
  formal_surrogate_loss: sewerrtc.v4.models_v42.hydraulic_trajectory_losses.HydraulicTrajectoryLoss
  paper_dataset_builder: sewerrtc.v4.v42_paper_dataset.build_paper_dataset
  hydraulic_target_audit: sewerrtc.v4.v42_hydraulic_target_audit.audit_detail_pool
  training_admission: sewerrtc.v4.v42_paper_training_admission.audit_training_admission
  raw_hydraulic_recorder: sewerrtc.simulation.v42_hydraulic_recorder.record_v42_hydraulic_targets
  training_action_authority: actual_readback_setting
  ordered_stages:
    - true_state_offline_validation
    - exact_swmm_closed_loop
    - surrogate_closed_loop
    - gat_integrated_closed_loop
    - policy_lock
    - challenge
    - formal_blind
  prohibit_v41_gate_authorization: true
  prohibit_legacy_locked_as_formal: true
  prohibit_legacy_kpi_head_trainer_as_formal: true
  formal_requires_policy_lock: true
  formal_requires_new_rainfall_sha: true
  stop_conditions:
    formal_step1_requires_temporal_gat_training: true
    formal_step1_requires_uncertainty_and_ood: true
    formal_step2_requires_raw_independent_oracle: true
    formal_step2_requires_complete_hydraulic_targets: true
    formal_step2_requires_explicit_outfall_flow: true

formal_blind:
  minimum_events: 24
  require_new_rainfall_sha: true
  allow_post_reveal_exclusion: false
