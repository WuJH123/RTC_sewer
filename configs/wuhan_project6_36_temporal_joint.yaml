_inherits: configs/wuhan_project6_v8_storage_36.yaml

# Isolated research line. Existing v8 and failed retrofit runs remain readable.
controller:
  mode: temporal_joint_36
  reference_policy_for_constraints: online_predicted_default
  horizon_steps: 6
  phase_reliability:
    exact_local_csv: ""
    empirical_single_action_gate: false
    require_pfv_improvement: false
    fallback_to_surrogate_without_local_evidence: false
  temporal_joint:
    model_path: outputs/models_temporal_joint_36/raw_joint_36_same_state_v2.pt
    predict_batch_size: 256
    action_influence_hops: 6
    action_influence_decay: 0.6
    training_validation:
      # Direction deadbands measure learnable effect signs. They are distinct
      # from the larger PFV non-inferiority allowance used by the safety gate.
      pfv_direction_tolerance_m3: 1.0
      tfv_direction_tolerance_m3: 100.0
      peak_direction_tolerance: 0.1
      min_direction_samples: 12
      min_pfv_direction_accuracy: 0.85
      min_tfv_direction_accuracy: 0.80
      min_peak_direction_accuracy: 0.85
      min_pfv_noninferiority_accuracy: 0.90
      max_zero_action_relative_error: 0.005
      pfv_abs_margin_m3: 100.0
      pfv_rel_margin: 0.005
    candidate_search:
      max_candidates: 512
      max_simultaneous_changes: 6
      max_change_points: 2
      continuous_max_delta: 0.10
      binary_pump_ids: [ADD301.2, ADD301.3]
      binary_pump_min_dwell_steps: 2
      max_pump_switches_per_event: 6
      storage_interlock: true
      max_storage_actuators: 4
    safety:
      pfv_abs_margin_m3: 100.0
      pfv_rel_margin: 0.005
      peak_margin: 0.0
      uncertainty_z: 1.645
      min_tfv_lcb_reduction: 0.0
    # Populated only from frozen v8 action groups and the paired evidence
    # manifest. New-asset evidence never suppresses these legacy candidates.
    legacy_groups:
      - [ADD424.4, ADD424.1, ADD424.2, ADD424.3]
      - [cc006.1, dwxh.2, dw3700.1, dw3700.2]
      - [MH0266931.2, MH0266932.2, MH0266933.1]
    paired_groups: []

experiment_design:
  primary_efficacy_return_periods: [T5, T10, T20]
  severe_stress_return_periods: [T50, T100]
  calibration_event_count: 14
  formal_event_count: 35
  pfv_margin_sensitivity_abs_m3: [50, 100, 200]
  pfv_margin_sensitivity_rel: [0.005, 0.01]
  effect_training_excluded_splits: [calibration, formal]

outputs:
  models: outputs/models_temporal_joint_36
  diagnostics: outputs/diagnostics_temporal_joint_36

temporal_joint_pipeline:
  root: outputs/project6_36_temporal_joint_v1
  paired_manifest: outputs/project6_36_fulltrain_v1/joint_data_plan/joint_action_case_manifest.csv
  intended_paired_experiments: 336
  intended_unique_physical_cases: 387
  hard_case_cap: 387
