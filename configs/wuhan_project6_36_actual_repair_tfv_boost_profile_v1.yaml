_inherits: configs/wuhan_project6_36_actual_repair_v1.yaml

# TFV-boost deployment profile.
# Uses completed closed-loop evidence to expand reliable takeover windows:
# - full takeover for event strata with event-level TFV and peak benefits;
# - time-window takeover where accepted-action audit showed TFV and peak safety;
# - true no-control fallback elsewhere.
controller:
  temporal_joint:
    deployment_reliability:
      evidence_csv: outputs/deployment_evidence/actual_repair_v1_tfv_boost_profile_windows.csv
      require_evidence: true
      time_tolerance_min: 0.25
    safety:
      pfv_abs_margin_m3: 100.0
      pfv_rel_margin: 0.02
      peak_margin: 0.0
      uncertainty_z: 0.0
      min_tfv_lcb_reduction: 0.0
      use_classifier_thresholds: false
      tfv_reduction_weight: 1.0
      peak_reduction_weight: 2500.0
      action_l1_penalty: 0.02
      simultaneous_action_penalty: 0.01
      pump_switch_penalty: 0.05

outputs:
  diagnostics: outputs/diagnostics_temporal_joint_36_actual_repair_tfv_boost_profile_v1
