name: V4.2 correctness contracts

on:
  pull_request:
    paths:
      - 'sewerrtc/v4/**'
      - 'tests/**'
      - 'docs/contracts/**'
      - 'requirements.txt'
      - '.github/workflows/v42-contract-tests.yml'
  workflow_dispatch:

jobs:
  v42-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile V4.2 modules
        run: python -m compileall -q sewerrtc/v4
      - name: P0/P1 regression tests
        run: pytest -q tests/test_v42_p0p1_regressions.py --tb=short
      - name: Full V4.2 regression suite
        run: pytest -q tests -k 'v42' --tb=short
